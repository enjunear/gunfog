[package]
name = "gunfog"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
description = "Scores prose with the Gunning fog index and names the sentences driving the score."
license = "Apache-2.0"
repository = "https://github.com/enjunear/gunfog"

[dependencies]
clap = { version = "4", features = ["derive"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
unicode-segmentation = "1.13.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Contains `inherits` and nothing else. `dist init` writes `lto = "thin"` here,
# which overrides the inherited `lto = true` and costs 124,664 bytes; delete it
# after any regeneration.
[profile.dist]
inherits = "release"
